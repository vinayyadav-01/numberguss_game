<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Number Guessing Game</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="card">
        <h1>🎯 Number Guessing Game</h1>
        <div class="sub">I'm thinking of a number between 1 and 100. Can you guess it?</div>

        <div class="stats">
            <div>Attempts<span id="attemptsUsed">0</span></div>
            <div>Left<span id="attemptsLeft">10</span></div>
            <div>Score<span id="score">0</span></div>
        </div>

        <div class="input-row">
            <input type="number" id="guessInput" min="1" max="100" placeholder="Enter a number (1-100)">
            <button id="guessBtn">Guess</button>
        </div>

        <div id="message" class="msg-info">Enter a number to start guessing 🙂</div>

        <div class="history" id="history"></div>

        <button id="resetBtn">🔄 New Game (Reset)</button>
    </div>

    <script src="script.js"></script>
</body>

</html>
